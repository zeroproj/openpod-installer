[package]
name = "openpod-tune"
version = "0.1.0"
edition = "2021"
description = "OpenPod Tune: OpenPod System ou OpenPod RockBox no player GN-438"
license = "GPL-2.0-or-later"
rust-version = "1.95"

[[bin]]
name = "openpod-tune"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
sha2 = "0.11"
ed25519-dalek = "2.2"
crc32fast = "1.5"
rusb = { version = "0.9", features = ["vendored"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: o SCSI pass-through do driver de disco do próprio Windows
# (instalador/src/aparelho/spt.rs), o cartão do RockBox e o .exe final.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Linux: a janela precisa do X11 e do Wayland (o eframe vem sem eles nas outras plataformas)
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
